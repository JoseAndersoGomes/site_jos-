<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Votação Basquete</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="janela">
        <!-- Menu Lateral -->
        <div class="header-left">
            <h1>Basquete</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav">
                <h3>Gráfico de Votos</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Fórum / Avisos</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        </div>

        <!-- Área Principal -->
        <div class="dash">
            
            <div class="btns-dash">
                <h2 style="color: white; margin-bottom: 20px;">Resultado em Tempo Real: Times Mais Votados</h2>
            </div>
            
            <!-- Container do Gráfico Único -->
            <div id="graficos">
                <div id="graficoVotacao" class="display-block">
                    <div class="graph">
                        <canvas id="myChartCanvas"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>

<script>
    // Recupera o nome do usuário para a saudação
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO || "Jogador";

    let proximaAtualizacao;

    // Carrega o gráfico automaticamente assim que a página abre
    window.onload = obterDadosGrafico();

    // 1. BUSCAR OS DADOS NO BANCO
    function obterDadosGrafico() {
        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        // Faz a requisição para a rota que devolve a contagem geral
        fetch(`/medidas/ultimas`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    plotarGrafico(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
        .catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
        });
    }

    // 2. DESENHAR O GRÁFICO NA TELA
    function plotarGrafico(resposta) {
        console.log('Iniciando plotagem do gráfico...');

        let labels = [];
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Votos',
                data: [],
                backgroundColor: 'rgba(255, 140, 0, 0.7)', // Cor laranja inspirada em basquete
                borderColor: 'rgb(255, 140, 0)',
                borderWidth: 1
            }]
        };

        // Alimenta as listas com o nome do time e a quantidade de votos
        for (let i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.nome); 
            dados.datasets[0].data.push(registro.qtd_votos);
        }

        const config = {
            type: 'bar', // Gráfico de barras (colunas)
            data: dados,
            options: {
                scales: {
                    y: {
                        beginAtZero: true // Garante que as barras comecem do zero
                    }
                }
            }
        };

        let myChart = new Chart(
            document.getElementById('myChartCanvas'),
            config
        );

        // Define a atualização para rodar a cada 2 segundos
        setTimeout(() => atualizarGrafico(dados, myChart), 2000);
    }

    // 3. ATUALIZAR AS BARRAS EM TEMPO REAL
    function atualizarGrafico(dados, myChart) {
        fetch(`/medidas/tempo-real`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {
                    
                    // Zera os dados antigos para evitar duplicação no gráfico
                    dados.labels = [];
                    dados.datasets[0].data = [];

                    // Coloca as contagens fresquinhas que vieram do banco
                    for (let i = 0; i < novoRegistro.length; i++) {
                        dados.labels.push(novoRegistro[i].nome);
                        dados.datasets[0].data.push(novoRegistro[i].qtd_votos);
                    }

                    // Manda o Chart.js atualizar visualmente a altura das barras
                    myChart.update();
                    
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado na atualização');
                proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
            }
        })
        .catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ atualização: ${error.message}`);
            proximaAtualizacao = setTimeout(() => atualizarGrafico(dados, myChart), 2000);
        });
    }
</script>
